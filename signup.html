<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="signup.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <title>SignUp</title>
  </head>
  <body>
    <header>
      <p class="logo">Ani<span class="domain2">Domain</span></p>
      <div class="right"><a href="anidomain.html">← Back to Home</a></div>
    </header>
    <section>
      <p class="logo2">Ani<span class="domain">Domain</span></p>
      <p class="welcome">Join the domain. Start your journey</p>

       <div class="username-section">
        <p class="username-text">Username</p>
        <input class="username" placeholder="@Gojo_Void">
      </div>


      <div class="email-section">
        <p class="email-text">Email</p>
        <input class="email" placeholder="you@example.com">
      </div>


      <div class="password-section">
          <p class="password-text">Password</p>
          <input class="password" placeholder="......." type="password">
        </div>


        <div class="terms-section">
          <input class="terms-box" type="checkbox">
          <p class="terms-text">I agree to the Terms of Service and Privacy Policy</p>
        </div>


        <button class="signup">Create Account</button>

        <div class="divider">
          <hr class="line">
          <p class="or">or</p>
          <hr class="line">
        </div>
       
        <button class="google">G
Continue with Google</button>
<p class="account">Already Have an Account? <a href="login.html">Login</a></p>
    </section>
  </body>
</html>
